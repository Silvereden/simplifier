version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: glacematic_db
    restart: always
    environment:
      POSTGRES_USER: glacematic_admin
      POSTGRES_PASSWORD: glacematic_secret_password
      POSTGRES_DB: glacematic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glacematic_admin -d glacematic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: glacematic_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://glacematic_admin:glacematic_secret_password@db:5432/glacematic_db
      - SECRET_KEY=super-secret-key-change-in-production-2026
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
      - exports_data:/app/exports
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
  exports_data: